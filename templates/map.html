<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map — Mountain Weather</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/images/evil.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #topbar { padding: 10px 16px; background: #2c3e50; color: #fff; display: flex; align-items: center; gap: 16px; }
        #topbar a { color: #9fd3ff; text-decoration: none; }
        #topbar h1 { font-size: 1.1rem; margin: 0; }
        #map { height: calc(100vh - 46px); }
        .legend { background: #fff; padding: 8px 10px; border-radius: 6px; line-height: 1.5; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 13px; }
        .cam-popup img { max-width: 260px; display: block; margin-top: 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="topbar">
        <h1>Mountain Weather — Locations &amp; Cameras</h1>
        <a href="/">← back to weather</a>
    </div>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const locations = {{!locations_json}};
        const cameras = {{!cameras_json}};

        const map = L.map('map');
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 16,
            attribution: '&copy; OpenStreetMap, OpenTopoMap'
        }).addTo(map);

        const weatherIcon = L.divIcon({ html: '⛅', className: '', iconSize: [26, 26], iconAnchor: [13, 13] });
        const camIcon = L.divIcon({ html: '📷', className: '', iconSize: [22, 22], iconAnchor: [11, 11] });

        const bounds = [];
        for (const [key, loc] of Object.entries(locations)) {
            bounds.push([loc.lat, loc.lon]);
            L.marker([loc.lat, loc.lon], { icon: weatherIcon, zIndexOffset: 100 })
                .addTo(map)
                .bindPopup(`<b>${loc.name}</b> (${loc.elevation})<br>Weather point for <a href="/${key}">/${key}</a><br><i>${loc.description}</i>`);
        }
        for (const c of cameras) {
            L.marker([c.lat, c.lon], { icon: camIcon })
                .addTo(map)
                .bindPopup(`<div class="cam-popup"><b>${c.name}</b><a href="${c.url}" target="_blank" rel="noopener"><img src="${c.url}" alt="${c.name}" loading="lazy"></a></div>`, { maxWidth: 290 });
        }
        map.fitBounds(bounds, { padding: [40, 40] });

        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = () => {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = '⛅ weather forecast point<br>📷 webcam (click for live view)';
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
